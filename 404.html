<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="robots" content="noindex">
<title>Page not found — Paradox of Acceptance</title>
<script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');</script>
<style>
  :root { --bg: #faf8f4; --ink: #2c2c2c; --muted: #666; --accent: #5a6b4e; }
  [data-theme="dark"] { --bg: #1a1a18; --ink: #e8e4dc; --muted: #9a958c; --accent: #a4b594; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  main { max-width: 520px; }
  svg { display: block; margin-bottom: 32px; }
  h1 { font-size: 32px; font-weight: 400; line-height: 1.25; margin-bottom: 16px; }
  p { font-size: 18px; line-height: 1.7; color: var(--muted); margin-bottom: 28px; }
  nav { display: flex; flex-wrap: wrap; gap: 12px 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; }
  a { color: var(--accent); text-underline-offset: 3px; }
</style>
</head>
<body>
<main>
  <svg width="48" height="48" viewBox="0 0 64 64" aria-hidden="true"><path d="M44.5 15.6 A20 20 0 1 0 50.6 26.5" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" style="color:var(--accent)"/></svg>
  <h1>This page is not here.</h1>
  <p>It may have moved, or the link may be wrong.</p>
  <nav>
    <a href="/">Home</a>
    <a href="/essays/">Essays</a>
    <a href="/blog/">Blog</a>
  </nav>
</main>
</body>
</html>
